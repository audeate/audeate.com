<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>audeate</title>
  <meta name="description" content="Backend, cloud & AI/ML engineering for music and creative companies." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ─────────────────────────────────── */
    :root {
      --bg:        #0a0a0b;
      --surface:   #111114;
      --border:    rgba(255,255,255,0.07);
      --muted:     rgba(255,255,255,0.35);
      --body:      rgba(255,255,255,0.70);
      --heading:   #f5f4f0;
      --accent:    #c8f060;   /* electric chartreuse — sharp, memorable */
      --accent2:   #5b6aff;   /* deep indigo secondary */
      --radius:    6px;
      --max:       1160px;
      --mono:      'DM Mono', monospace;
      --sans:      'Syne', sans-serif;
      --serif:     'Cormorant Garamond', serif;
    }

    /* ─── RESET ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ul { list-style: none; }

    /* ─── NOISE OVERLAY ──────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 9999;
    }

    /* ─── LAYOUT HELPERS ─────────────────────────── */
    .container {
      width: 100%;
      max-width: var(--max);
      margin-inline: auto;
      padding-inline: clamp(1.5rem, 5vw, 4rem);
    }
    .label {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .accent-dot { color: var(--accent); }

    /* ─── ANIMATIONS ─────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.4; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .fade-up { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both; }
    .delay-1 { animation-delay: 0.12s; }
    .delay-2 { animation-delay: 0.24s; }
    .delay-3 { animation-delay: 0.36s; }
    .delay-4 { animation-delay: 0.52s; }
    .delay-5 { animation-delay: 0.68s; }

    /* ─── NAV ────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding-block: 1.25rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s, background 0.3s, backdrop-filter 0.3s;
    }
    nav.scrolled {
      border-color: var(--border);
      background: rgba(10,10,11,0.82);
      backdrop-filter: blur(18px);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--heading);
    }
    .logo span { color: #a8d87a; }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--heading); }
    .nav-cta {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg) !important;
      background: var(--accent);
      padding: 0.55rem 1.2rem;
      border-radius: var(--radius);
      transition: opacity 0.2s !important;
    }
    .nav-cta:hover { opacity: 0.85 !important; }

    /* ─── HERO ───────────────────────────────────── */
    #hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: clamp(4rem, 8vh, 7rem);
      padding-top: 7rem;
      position: relative;
      overflow: hidden;
    }

    /* mesh gradient backdrop */
    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 75% 15%, rgba(91,106,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(200,240,96,0.10) 0%, transparent 55%);
      pointer-events: none;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(200,240,96,0.08);
      border: 1px solid rgba(200,240,96,0.2);
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      position: relative;
      flex-shrink: 0;
    }
    .pulse::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-ring 1.6s ease-out infinite;
    }

    .hero-headline {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(3.2rem, 8.5vw, 8rem);
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--heading);
      max-width: 14ch;
      margin-bottom: 2rem;
    }
    .hero-headline em {
      font-style: italic;
      color: var(--muted);
    }

    .hero-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 2rem;
    }
    .hero-sub {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--body);
      max-width: 42ch;
    }
    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
    }
    .hero-actions .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* ─── BUTTONS ────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.75rem 1.6rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost {
      border-color: var(--border);
      color: var(--body);
      background: transparent;
    }
    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--heading);
    }
    .btn-arrow { font-size: 0.9em; }

    /* ─── SECTION SHARED ─────────────────────────── */
    section {
      padding-block: clamp(5rem, 10vh, 9rem);
    }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: clamp(3rem, 6vh, 5rem);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    .section-title {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2rem, 4.5vw, 3.6rem);
      letter-spacing: -0.02em;
      color: var(--heading);
      line-height: 1.1;
    }
    .section-title em { font-style: italic; color: var(--muted); }
    .section-num {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* ─── MARQUEE STRIP ──────────────────────────── */
    .marquee-strip {
      overflow: hidden;
      border-block: 1px solid var(--border);
      padding-block: 1rem;
      background: var(--surface);
    }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }
    .marquee-item {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding-inline: 2rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .marquee-item::after {
      content: '✦';
      font-size: 0.5em;
      color: var(--accent);
    }

    /* ─── FEATURES ───────────────────────────────── */
    #features .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      overflow: hidden;
    }
    .feature-card {
      background: var(--bg);
      padding: 2.5rem 2rem;
      position: relative;
      transition: background 0.25s;
    }
    .feature-card:hover { background: var(--surface); }
    .feature-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .feature-card:hover::before { transform: scaleX(1); }
    .feature-icon {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      background: var(--surface);
    }
    .feature-name {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--heading);
      margin-bottom: 0.6rem;
    }
    .feature-desc {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--muted);
    }

    /* ─── PRODUCT PREVIEW ────────────────────────── */
    #product .preview-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    #product .preview-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(91,106,255,0.12) 0%, transparent 70%);
    }
    .preview-placeholder {
      text-align: center;
    }
    .preview-placeholder p {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.75rem;
    }
    .preview-icon {
      width: 52px; height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      background: var(--bg);
    }
    .preview-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── SOCIAL PROOF ───────────────────────────── */
    #proof .quotes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(1rem, 2vw, 2rem);
    }
    .quote-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .quote-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--heading);
      margin-bottom: 1.25rem;
    }
    .quote-author {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .author-info { font-size: 0.8rem; }
    .author-name { color: var(--heading); font-weight: 600; }
    .author-role { color: var(--muted); margin-top: 0.1rem; }

    /* ─── PRICING ────────────────────────────────── */
    #pricing .plans {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      overflow: hidden;
    }
    .plan {
      background: var(--bg);
      padding: 2.5rem 2rem;
      position: relative;
      transition: background 0.2s;
    }
    .plan.featured {
      background: var(--surface);
    }
    .plan-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .plan-name {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .plan-price {
      font-family: var(--serif);
      font-size: 3rem;
      font-weight: 300;
      color: var(--heading);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .plan-price sup {
      font-size: 0.5em;
      vertical-align: super;
      color: var(--muted);
    }
    .plan-period {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .plan-features {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .plan-features li {
      font-size: 0.87rem;
      color: var(--body);
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .plan-features li::before {
      content: '—';
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.75em;
      flex-shrink: 0;
    }
    .plan-cta {
      margin-top: 2rem;
    }
    .btn-plan {
      width: 100%;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      color: var(--body);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
    }
    .btn-plan:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--heading);
    }
    .btn-plan.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .btn-plan.primary:hover { opacity: 0.88; }

    /* ─── FAQ ────────────────────────────────────── */
    #faq .faq-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .faq-item {
      border-bottom: 1px solid var(--border);
    }
    .faq-q {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      padding-block: 1.5rem;
      cursor: pointer;
      gap: 2rem;
      color: var(--heading);
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 500;
    }
    .faq-icon {
      font-family: var(--mono);
      font-size: 1.2rem;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.25s;
      line-height: 1;
    }
    .faq-item.open .faq-icon { transform: rotate(45deg); color: var(--accent); }
    .faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .faq-item.open .faq-a { max-height: 300px; }
    .faq-a p {
      padding-bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
      max-width: 70ch;
    }

    /* ─── CTA BAND ───────────────────────────────── */
    #cta {
      padding-block: clamp(5rem, 10vh, 9rem);
    }
    .cta-inner {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: clamp(3rem, 7vw, 6rem);
      position: relative;
      overflow: hidden;
      text-align: center;
      background: var(--surface);
    }
    .cta-inner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(91,106,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 10%, rgba(200,240,96,0.08) 0%, transparent 55%);
      pointer-events: none;
    }
    .cta-label {
      margin-bottom: 1.25rem;
    }
    .cta-headline {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.4rem, 5.5vw, 5rem);
      letter-spacing: -0.025em;
      line-height: 1.1;
      color: var(--heading);
      max-width: 18ch;
      margin-inline: auto;
      margin-bottom: 2rem;
    }
    .cta-headline em { font-style: italic; color: var(--muted); }
    .cta-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* ─── FOOTER ─────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding-block: 2.5rem;
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .footer-logo {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--heading);
    }
    .footer-logo span { color: #a8d87a; }
    .footer-links {
      display: flex;
      gap: 2rem;
    }
    .footer-links a {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--heading); }
    .footer-copy {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    /* ─── RESPONSIVE ─────────────────────────────── */
    @media (max-width: 900px) {
      #features .grid { grid-template-columns: 1fr 1fr; }
      #pricing .plans { grid-template-columns: 1fr; }
      #proof .quotes-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .hero-bottom { grid-template-columns: 1fr; }
      .hero-actions { align-items: flex-start; }
      .hero-actions .btn-group { justify-content: flex-start; }
      #features .grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .section-header { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>

<body>

  <!-- ══ NAV ═════════════════════════════════════════ -->
  <nav id="nav">
    <div class="container nav-inner">
      <div class="logo">aude<span>ate</span></div>
      <ul class="nav-links">
        <li><a href="mailto:hello@audeate.com">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- ══ HERO ════════════════════════════════════════ -->
  <section id="hero">
    <div class="container">

      <div class="hero-eyebrow fade-up">
        <div class="hero-badge">
          Backend · Cloud · AI
        </div>
      </div>

      <h1 class="hero-headline fade-up delay-1">
        Engineering <em>that scales</em>
      </h1>

      <div class="hero-bottom fade-up delay-2">
        <p class="hero-sub">
